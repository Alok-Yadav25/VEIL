services:
  - type: web
    name: veil-steganography
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: SPRING_PROFILES_ACTIVE
        value: production
